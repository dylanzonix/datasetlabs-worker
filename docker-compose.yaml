version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: datasetlabs
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: datasetlabs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table
    volumes:
      - azurite_data:/data
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"

volumes:
  postgres_data:
  azurite_data: