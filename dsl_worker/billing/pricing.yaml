# OpenAI model pricing
# Prices in USD per token

models:
  # Embedding models
  text-embedding-3-large:
    input: 0.00000013    # $0.13 / 1M tokens
    output: 0.0

  text-embedding-3-small:
    input: 0.00000002    # $0.02 / 1M tokens
    output: 0.0

  # Chat models
  gpt-4o:
    input: 0.0000025     # $2.50 / 1M tokens
    output: 0.000010     # $10.00 / 1M tokens

  gpt-4o-mini:
    input: 0.00000015    # $0.15 / 1M tokens
    output: 0.0000006    # $0.60 / 1M tokens

  gpt-4-turbo:
    input: 0.00001       # $10.00 / 1M tokens
    output: 0.00003      # $30.00 / 1M tokens

  gpt-3.5-turbo:
    input: 0.0000005     # $0.50 / 1M tokens
    output: 0.0000015    # $1.50 / 1M tokens

  # o1 models (reasoning)
  o1:
    input: 0.000015      # $15.00 / 1M tokens
    output: 0.000060     # $60.00 / 1M tokens

  o1-mini:
    input: 0.000003      # $3.00 / 1M tokens
    output: 0.000012     # $12.00 / 1M tokens

  # GPT 5
  gpt-5.4:
    input: 0.0000025      # $2.50 / 1M tokens (short context <272K)
    cached_input: 0.00000025  # $0.25 / 1M tokens
    output: 0.000015      # $15.00 / 1M tokens

  gpt-5.2:
    input: 0.00000175    # $1.75 / 1M tokens
    cached_input: 0.00000018  # $0.18 / 1M tokens (Azure pricing)
    output: 0.000014     # $14.00 / 1M tokens

  gpt-5.4-mini:
    input: 0.00000075    # $0.75 / 1M tokens
    cached_input: 0.000000075  # $0.075 / 1M tokens
    output: 0.0000045    # $4.50 / 1M tokens

  gpt-5-mini:
    input: 0.00000025    # $0.25 / 1M tokens
    output: 0.000002     # $2.00 / 1M tokens

  gpt-5.4-nano:
    input: 0.0000002     # $0.20 / 1M tokens
    cached_input: 0.00000002  # $0.02 / 1M tokens
    output: 0.00000125   # $1.25 / 1M tokens

  gpt-5-nano:
    input: 0.00000005    # $0.05 / 1M tokens
    output: 0.0000004    # $0.40 / 1M tokens

  # Anthropic Claude models
  claude-opus-4-7:
    input: 0.000005      # $5.00 / 1M tokens
    cached_input: 0.0000005  # $0.50 / 1M tokens (cache read ~10% of input)
    output: 0.000025     # $25.00 / 1M tokens

  claude-sonnet-4-6:
    input: 0.000003      # $3.00 / 1M tokens
    cached_input: 0.0000003  # $0.30 / 1M tokens
    output: 0.000015     # $15.00 / 1M tokens

  claude-haiku-4-5:
    input: 0.000001      # $1.00 / 1M tokens
    cached_input: 0.0000001  # $0.10 / 1M tokens
    output: 0.000005     # $5.00 / 1M tokens